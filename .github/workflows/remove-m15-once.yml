name: Remove M15 from Premium chart

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Remove M15 timeframe from Premium chart'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove M15 option
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/components/PremiumAnalyst.tsx')
          s = p.read_text()
          s = s.replace("const intervals=[['15m','M15'],['1h','H1'],['4h','H4'],['1d','D1']] as const", "const intervals=[['1h','H1'],['4h','H4'],['1d','D1']] as const")
          s = s.replace("function tfShort(i:string){return({ '15m':'M15','1h':'H1','4h':'H4','1d':'D1' } as any)[i]||i}", "function tfShort(i:string){return({ '1h':'H1','4h':'H4','1d':'D1' } as any)[i]||i}")
          s = s.replace("function tfLong(i:string){return i==='15m'?'15 daqiqalik (M15)':i==='4h'?'4 soatlik (H4)':i==='1d'?'1 kunlik (D1)':'1 soatlik (H1)' }", "function tfLong(i:string){return i==='4h'?'4 soatlik (H4)':i==='1d'?'1 kunlik (D1)':'1 soatlik (H1)'}")
          s = s.replace("function tfLong(i:string){return i==='15m'?'15 daqiqalik (M15)':i==='4h'?'4 soatlik (H4)':i==='1d'?'1 kunlik (D1)':'1 soatlik (H1)'}", "function tfLong(i:string){return i==='4h'?'4 soatlik (H4)':i==='1d'?'1 kunlik (D1)':'1 soatlik (H1)'}")
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          rm -f .github/workflows/remove-m15-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/components/PremiumAnalyst.tsx .github/workflows/remove-m15-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Remove M15 timeframe from Premium chart'
          git push
